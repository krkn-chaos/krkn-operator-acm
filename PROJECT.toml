# Repository context read through AGENTS.md; not a native Codex settings file.
# Place both files in krkn-operator-ecosystem/krkn-operator-acm/.
# Relative paths below are resolved from that repository's root.

[project]
name = "krkn-operator-acm"
type = "go-operator"
description = "ACM integration operator for the Krkn operator ecosystem."
repository = "https://github.com/krkn-chaos/krkn-operator-acm"

[ecosystem_projects]
krkn-operator = "../krkn-operator"
krkn-operator-console = "../krkn-operator-console"
krkn-operator-acm = "."
krknctl = "../../krknctl"
krkn = "../../krkn"

# Internal source paths are intentionally not asserted here: discover the actual
# package/controller layout, API definitions, and generated files in the checkout.

[beads]
project_label = "project:krkn-operator-acm"
# Use the existing repository .beads symlink to the shared central database.
# Do not initialize a new database or replace the symlink.
central_database = ".beads"
export_path = "beads/"
# Preserve the configured shared issue prefix (tsebastiani).
# Follow the checkout's actual Git policy for exports; do not change it here.

[commands]
# Intentionally unset at the user's request; this is not a blocker by itself.
# Discover needed commands from the checkout's build files, scripts, and CI.
# These commented examples are NOT verified targets for this repository.
# build = "make build"
# test = "make test"
# lint = "make lint"
# format = "make fmt"

# No deploy, cluster-install, or chaos command is authorized by this file.
# Coverage requirements come from existing project/CI policy, not a new default.
