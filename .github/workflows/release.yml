name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ========================================
  # BUILD JOBS - Run in parallel
  # ========================================

  build-acm-amd64:
    name: Build ACM (linux/amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: quay.io/krkn-chaos/krkn-operator-acm:${{ env.VERSION }}-amd64
          cache-from: type=gha,scope=acm-amd64
          cache-to: type=gha,mode=max,scope=acm-amd64

  build-acm-arm64:
    name: Build ACM (linux/arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: quay.io/krkn-chaos/krkn-operator-acm:${{ env.VERSION }}-arm64
          cache-from: type=gha,scope=acm-arm64
          cache-to: type=gha,mode=max,scope=acm-arm64

  # ========================================
  # MANIFEST CREATION - After all builds
  # ========================================

  create-manifest:
    name: Create Multi-Arch Manifest
    needs:
      - build-acm-amd64
      - build-acm-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Create multi-arch manifest
        run: |
          # Create versioned tag
          docker buildx imagetools create -t quay.io/krkn-chaos/krkn-operator-acm:$VERSION \
            quay.io/krkn-chaos/krkn-operator-acm:$VERSION-amd64 \
            quay.io/krkn-chaos/krkn-operator-acm:$VERSION-arm64

          # Create latest tag
          docker buildx imagetools create -t quay.io/krkn-chaos/krkn-operator-acm:latest \
            quay.io/krkn-chaos/krkn-operator-acm:$VERSION-amd64 \
            quay.io/krkn-chaos/krkn-operator-acm:$VERSION-arm64

      - name: Verify manifest
        run: |
          echo "Verifying multi-arch manifest..."
          docker buildx imagetools inspect quay.io/krkn-chaos/krkn-operator-acm:$VERSION

      - name: Generate Release Notes
        id: generate
        continue-on-error: true
        run: |
          python3 scripts/generate-release-notes.py \
            --version $VERSION \
            --repo-url https://github.com/krkn-operator-ecosystem/krkn-operator-acm \
            --docs-url https://krkn-chaos.dev/docs/krkn-operator/ \
            > release-notes.md

      - name: Fallback Release Notes
        if: steps.generate.outcome == 'failure'
        run: |
          echo "## Release $VERSION" > release-notes.md
          echo "" >> release-notes.md
          echo "See commit history for changes." >> release-notes.md
          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "" >> release-notes.md
          echo "**Documentation**: https://krkn-chaos.dev/docs/krkn-operator/" >> release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $VERSION --title "Release $VERSION" --notes-file release-notes.md