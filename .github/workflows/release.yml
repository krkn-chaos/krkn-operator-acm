name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ========================================
  # BUILD JOBS - Run in parallel
  # ========================================

  build-acm-amd64:
    name: Build ACM (linux/amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: quay.io/krkn-chaos/krkn-operator-acm:${{ env.VERSION }}-amd64
          cache-from: type=gha,scope=acm-amd64
          cache-to: type=gha,mode=max,scope=acm-amd64

  build-acm-arm64:
    name: Build ACM (linux/arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: quay.io/krkn-chaos/krkn-operator-acm:${{ env.VERSION }}-arm64
          cache-from: type=gha,scope=acm-arm64
          cache-to: type=gha,mode=max,scope=acm-arm64

  # ========================================
  # MANIFEST CREATION - After all builds
  # ========================================

  create-manifest:
    name: Create Multi-Arch Manifest
    needs:
      - build-acm-amd64
      - build-acm-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Create multi-arch manifest
        run: |
          # Create versioned tag
          docker buildx imagetools create -t quay.io/krkn-chaos/krkn-operator-acm:$VERSION \
            quay.io/krkn-chaos/krkn-operator-acm:$VERSION-amd64 \
            quay.io/krkn-chaos/krkn-operator-acm:$VERSION-arm64

          # Create latest tag
          docker buildx imagetools create -t quay.io/krkn-chaos/krkn-operator-acm:latest \
            quay.io/krkn-chaos/krkn-operator-acm:$VERSION-amd64 \
            quay.io/krkn-chaos/krkn-operator-acm:$VERSION-arm64

      - name: Verify manifest
        run: |
          echo "Verifying multi-arch manifest..."
          docker buildx imagetools inspect quay.io/krkn-chaos/krkn-operator-acm:$VERSION

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Let GitHub select the previous release and generate the notes from
          # the commits since then, as it does for a manual release.
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --generate-notes \
            --verify-tag

  publish-olm-bundle:
    name: Build and publish OLM bundle
    needs: create-manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      REGISTRY: quay.io
      IMAGE_NAMESPACE: krkn-chaos
      BUNDLE_REPOSITORY: quay.io/krkn-chaos/krkn-operator-acm-bundle
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Install bundle tooling
        run: |
          operator_sdk_version=v1.41.1
          operator_sdk_sha256=348284cbd5298f70e2b0a01f9f86820a3149aa6e7e19272e886a9d5769c7fb69
          curl --fail --location --retry 3 \
            --output /tmp/operator-sdk \
            "https://github.com/operator-framework/operator-sdk/releases/download/${operator_sdk_version}/operator-sdk_linux_amd64"
          printf '%s  %s\n' "$operator_sdk_sha256" /tmp/operator-sdk | sha256sum --check --status -
          sudo install -m 0755 /tmp/operator-sdk /usr/local/bin/operator-sdk

          kustomize_version=v5.6.0
          kustomize_sha256=54e4031ddc4e7fc59e408da29e7c646e8e57b8088c51b84b3df0864f47b5148f
          curl --fail --location --retry 3 \
            --output /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${kustomize_version}/kustomize_${kustomize_version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$kustomize_sha256" /tmp/kustomize.tar.gz | sha256sum --check --status -
          tar -xz -f /tmp/kustomize.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize

          yq_sha256=654d2943ca1d3be2024089eb4f270f4070f491a0610481d128509b2834870049
          curl --fail --location --retry 3 \
            --output /tmp/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          printf '%s  %s\n' "$yq_sha256" /tmp/yq | sha256sum --check --status -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Render and publish bundle
        env:
          KUSTOMIZE: /usr/local/bin/kustomize
        run: |
          bundle_version="${RELEASE_TAG#v}"
          export OPERATOR_IMAGE="$REGISTRY/$IMAGE_NAMESPACE/krkn-operator-acm:$RELEASE_TAG"
          output_dir="dist/bundle"

          chmod +x hack/olm/render-bundle.sh
          hack/olm/render-bundle.sh "$bundle_version" "$output_dir"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file "$GITHUB_WORKSPACE/$output_dir/bundle.Dockerfile" \
            --tag "$BUNDLE_REPOSITORY:$RELEASE_TAG" \
            --push \
            "$output_dir"

          docker buildx imagetools inspect "$BUNDLE_REPOSITORY:$RELEASE_TAG"
