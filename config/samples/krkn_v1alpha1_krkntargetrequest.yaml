#
# Sample KrknTargetRequest
#
# The operator will automatically:
# 1. Add label: krkn.krkn-chaos.dev/uuid with the UUID value
# 2. Set status to "pending"
# 3. Process the request
# 4. Update status to "Completed"
#
# You can select requests by UUID using:
#   kubectl get krkntargetrequests -l krkn.krkn-chaos.dev/uuid=test-uuid-12345
#
apiVersion: krkn.krkn-chaos.dev/v1alpha1
kind: KrknTargetRequest
metadata:
  labels:
    app.kubernetes.io/name: krkn-operator-acm
    app.kubernetes.io/managed-by: kustomize
  name: krkntargetrequest-sample
spec:
  uuid: "test-uuid-12345"
