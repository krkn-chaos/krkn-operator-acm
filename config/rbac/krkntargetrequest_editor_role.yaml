# This rule is not used by the project krkn-operator-acm itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the krkn.krkn-chaos.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: krkn-operator-acm
    app.kubernetes.io/managed-by: kustomize
  name: krkntargetrequest-editor-role
rules:
- apiGroups:
  - krkn.krkn-chaos.dev
  resources:
  - krkntargetrequests
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - krkn.krkn-chaos.dev
  resources:
  - krkntargetrequests/status
  verbs:
  - get
